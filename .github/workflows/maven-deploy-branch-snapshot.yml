# Maven Deploy Branch Snapshot Workflow (experimental)
#
# Deploys Maven artifacts from a feature branch using branch-isolated SNAPSHOT
# versioning: X.Y.Z-SNAPSHOT → X.Y.Z-<branch>-SNAPSHOT. This prevents branch
# artifacts from overwriting main or other branch artifacts in the repository.
#
# Triggers:
#   - Manual dispatch with explicit branch selection
#
# See maven-deploy-branch-snapshot.yml in qubership-core-infra for full documentation.

name: Maven deploy (branch snapshot)

run-name: Deploy branch snapshot [${{ inputs.branch }}]

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
      skip-tests:
        description: 'Skip Maven tests during deploy'
        required: false
        type: boolean
        default: true

permissions:
  packages: write
  contents: read

jobs:
  maven-deploy:
    uses: Netcracker/qubership-core-infra/.github/workflows/maven-deploy-branch-snapshot.yml@75e193f58f0c209d19eda526b2a5137cdb3bc557 # feat/consistent-snapshots
    with:
      branch: ${{ inputs.branch }}
      skip-tests: ${{ inputs.skip-tests }}
      maven-username: 'NetcrackerCLPLCI'
    secrets:
      MAVEN_TOKEN: ${{ secrets.GH_RWD_PACKAGE_TOKEN }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}